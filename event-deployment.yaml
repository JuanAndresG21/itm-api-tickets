apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-api-deployment
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: event-api
  template:
    metadata:
      labels:
        app: event-api
    spec:
      containers:
      - name: event-api
        image: juanandres0221/itm-event-api:latest
        imagePullPolicy: Always
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: Development
        envFrom:
        - secretRef:
            name: itm-env
        ports:
        - containerPort: 8080
          protocol: TCP
        resources:
          requests:
            cpu: 100m
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: event-api-service
  namespace: default
spec:
  selector:
    app: event-api
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
