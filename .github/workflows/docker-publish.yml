name: Build and Push Docker Images

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: gateway
            dockerfile: Itm.Gateway.Api/Dockerfile
            image: itm-gateway-api
          - service: booking
            dockerfile: Itm.Booking.Api/Dockerfile
            image: itm-booking-api
          - service: event
            dockerfile: Itm.Event.Api/Dockerfile
            image: itm-event-api
          - service: discount
            dockerfile: Itm.Discount.Api/Dockerfile
            image: itm-discount-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:latest
